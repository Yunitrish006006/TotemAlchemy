name: Invoke opposing-effect chemistry fix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/trigger-opposing-effect-fix.txt
      - .github/workflows/invoke-opposing-effect-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/opposing-effects-and-pufferfish
          fetch-depth: 0

      - name: Apply chemistry patch
        shell: python
        run: |
          from pathlib import Path
          import re

          state_path = Path('src/main/java/dev/totem/alchemy/mixture/AlchemyMixtureState.java')
          state = state_path.read_text()
          state, count = re.subn(
              r'    /\*\* Adds one independently rolled outcome set without collapsing intentionally coexisting opposites\. \*/\n'
              r'    public void addIndependentOutcomeEffects\(Map<String, EffectDose> additions\) \{.*?\n    \}',
              '''    /** Adds one independently rolled outcome set, then resolves chemically opposing effects. */
              public void addIndependentOutcomeEffects(Map<String, EffectDose> additions) {
                  addEffects(additions);
              }'''.replace('              ', ''),
              state,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'independent outcome replacement count={count}')

          anchor = '        neutralizePair("minecraft:instant_health", "minecraft:instant_damage");\n'
          if anchor not in state:
              raise SystemExit('neutralize anchor not found')
          state = state.replace(anchor, anchor + '        neutralizePair("minecraft:regeneration", "minecraft:poison");\n', 1)

          state, count = re.subn(
              r'        if \(!state\.provenance\.contains\(PRESERVE_INDEPENDENT_OUTCOMES\)\) \{\n'
              r'            state\.neutralizeOpposites\(\);\n'
              r'        \}',
              '''        // Migrate mixtures created by builds that intentionally preserved opposing rolled outcomes.
              state.provenance.remove(PRESERVE_INDEPENDENT_OUTCOMES);
              state.neutralizeOpposites();'''.replace('              ', ''),
              state,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'decode migration replacement count={count}')
          state_path.write_text(state)

          brewing_path = Path('src/main/java/dev/totem/alchemy/mixture/AlchemyMixtureBrewing.java')
          brewing = brewing_path.read_text()
          old = '        String reactionPrefix = outcomeIngredient || state.preservesIndependentOutcomes() ? "brewset:" : "brew:";'
          if old not in brewing:
              raise SystemExit('reaction prefix line not found')
          brewing = brewing.replace(old, '        String reactionPrefix = "brew:";', 1)
          old = '            state.addIndependentOutcomeEffects(scaleEffects(additions, state.volumeUnits()));'
          if old not in brewing:
              raise SystemExit('brewing stand outcome add line not found')
          brewing = brewing.replace(old, '            state.addEffects(scaleEffects(additions, state.volumeUnits()));', 1)
          brewing_path.write_text(brewing)

          weights_path = Path('src/main/resources/data/totem/totem_alchemy/brewing_outcome_weights/defaults.json')
          weights = weights_path.read_text()
          old = '{"ingredient":"minecraft:pufferfish","outcomes":{"minecraft:water_breathing":96,"minecraft:poison":3,"minecraft:weakness":1}}'
          new = '{"ingredient":"minecraft:pufferfish","outcomes":{"minecraft:water_breathing":96,"minecraft:poison":45,"minecraft:weakness":8}}'
          if old not in weights:
              raise SystemExit('pufferfish weights not found')
          weights_path.write_text(weights.replace(old, new, 1))

          test_path = Path('src/gametest/java/dev/totem/alchemy/gametest/AlchemyCauldronPersistenceGameTest.java')
          tests = test_path.read_text()
          tests = tests.replace(
              'public void brewingBatchSharesExactOpposingEffectSetAcrossAllBottles(GameTestHelper helper)',
              'public void brewingBatchNeutralizesOpposingEffectsAcrossAllBottles(GameTestHelper helper)',
              1,
          )
          old = '''                require(helper, state.effects().containsKey("minecraft:speed")
                                  && state.effects().containsKey("minecraft:slowness"),
                          "Produced bottle collapsed an independently selected opposing-effect pair");
                  require(helper, state.preservesIndependentOutcomes(),
                          "Produced bottle did not persist its independent outcome-set marker");'''.replace('                  ', '')
          new = '''                require(helper, !(state.effects().containsKey("minecraft:speed")
                                  && state.effects().containsKey("minecraft:slowness")),
                          "Produced bottle retained mutually opposing speed and slowness effects");
                  require(helper, !state.preservesIndependentOutcomes(),
                          "Produced bottle retained the obsolete independent-outcome marker");'''.replace('                  ', '')
          if old not in tests:
              raise SystemExit('brewing bottle assertion block not found')
          tests = tests.replace(old, new, 1)

          old = '''            require(helper, restored.effects().containsKey("minecraft:speed")
                              && restored.effects().containsKey("minecraft:slowness"),
                      "Potion round-trip or duration/potency modifiers collapsed selected opposing effects");'''.replace('              ', '')
          new = '''            require(helper, !(restored.effects().containsKey("minecraft:speed")
                              && restored.effects().containsKey("minecraft:slowness")),
                      "Potion round-trip or duration/potency modifiers restored opposing effects");'''.replace('              ', '')
          if old not in tests:
              raise SystemExit('round-trip assertion block not found')
          tests = tests.replace(old, new, 1)

          tests = tests.replace(
              'public void cauldronCanScheduleSeveralIndependentEffectsInOneReaction(GameTestHelper helper)',
              'public void cauldronNeutralizesOpposingSelectedEffectsInOneReaction(GameTestHelper helper)',
              1,
          )
          replacements = [
              (
                  '''        require(helper, state.effects().containsKey("minecraft:speed")
                          && state.effects().containsKey("minecraft:slowness")
                          && state.preservesIndependentOutcomes(),
                  "Cauldron reaction did not retain a simultaneous swiftness/slowness outcome set");''',
                  '''        require(helper, !(state.effects().containsKey("minecraft:speed")
                          && state.effects().containsKey("minecraft:slowness"))
                          && !state.preservesIndependentOutcomes(),
                  "Cauldron reaction retained simultaneous swiftness/slowness effects");'''
              ),
              (
                  '''        require(helper, state.effects().containsKey("minecraft:speed")
                          && state.effects().containsKey("minecraft:slowness")
                          && state.preservesIndependentOutcomes(),
                  "Delayed cauldron redstone reaction collapsed selected opposing effects");''',
                  '''        require(helper, !(state.effects().containsKey("minecraft:speed")
                          && state.effects().containsKey("minecraft:slowness"))
                          && !state.preservesIndependentOutcomes(),
                  "Delayed cauldron redstone reaction restored opposing effects");'''
              ),
              (
                  '''        require(helper, state.deliveryForm() == AlchemyMixtureState.DeliveryForm.SPLASH
                          && state.effects().containsKey("minecraft:speed")
                          && state.effects().containsKey("minecraft:slowness")
                          && state.preservesIndependentOutcomes(),
                  "Delayed delivery-form reaction collapsed selected opposing effects");''',
                  '''        require(helper, state.deliveryForm() == AlchemyMixtureState.DeliveryForm.SPLASH
                          && !(state.effects().containsKey("minecraft:speed")
                                  && state.effects().containsKey("minecraft:slowness"))
                          && !state.preservesIndependentOutcomes(),
                  "Delayed delivery-form reaction restored opposing effects");'''
              ),
          ]
          for old, new in replacements:
              if old not in tests:
                  raise SystemExit('cauldron assertion block not found')
              tests = tests.replace(old, new, 1)
          test_path.write_text(tests)

      - name: Commit applied fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-opposing-effect-fix.yml \
                 .github/workflows/invoke-opposing-effect-fix.yml \
                 .github/trigger-opposing-effect-fix.txt
          git add src/main/java/dev/totem/alchemy/mixture/AlchemyMixtureState.java \
                  src/main/java/dev/totem/alchemy/mixture/AlchemyMixtureBrewing.java \
                  src/main/resources/data/totem/totem_alchemy/brewing_outcome_weights/defaults.json \
                  src/gametest/java/dev/totem/alchemy/gametest/AlchemyCauldronPersistenceGameTest.java
          git commit -m 'fix(alchemy): neutralize opposing outcomes and strengthen pufferfish poison'
          git push origin HEAD:fix/opposing-effects-and-pufferfish
