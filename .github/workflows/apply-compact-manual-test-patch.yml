name: Apply compact manual test patch

on:
  push:
    branches: [fix/compact-manual-material-pages]
    paths: [.github/workflows/apply-compact-manual-test-patch.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-manual-material-pages
          fetch-depth: 0
      - name: Update stale page-count assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/gametest/java/dev/totem/alchemy/gametest/AlchemyManualGameTest.java')
          text = path.read_text()
          old = 'int expectedPageCount = AlchemyMaterialCatalog.entries().size() + 4;'
          new = 'int expectedPageCount = AlchemyMaterialCatalog.pageCount() + 4;'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale page-count assertion, got {text.count(old)}')
          path.write_text(text.replace(old, new))
      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-compact-manual-test-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(manual): follow compact page count'
          git push origin HEAD:fix/compact-manual-material-pages
