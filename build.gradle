plugins {
    id 'fabric-loom' version '1.17.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

def totemCoreJar = file(providers.gradleProperty("totemCoreJar")
        .getOrElse("../TotemCore/build/libs/totem-core-0.7.22.jar"))

loom {
    splitEnvironmentSourceSets()
    mods {
        'totem-alchemy' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "totem-alchemy-gametest"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.codemc.io/repository/relativitymc/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    runtimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation files(totemCoreJar)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

def namedRuntimeSources = new LinkedHashSet<File>()
def namedRuntimeCopies = [:]
def namedRuntimeCopyFor = { File source ->
    namedRuntimeCopies.computeIfAbsent(source.absolutePath) {
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()
        layout.buildDirectory.file("named-runtime-api/v2/${digest}-${source.name}").get().asFile
    }
}
tasks.register('normalizeFabricApiTweakersForNamedDevRuntime') {
    group = 'fabric'
    description = 'Creates isolated named-namespace Fabric API copies for development runs.'
    inputs.files(provider { namedRuntimeSources })
    outputs.dir(layout.buildDirectory.dir('named-runtime-api/v2'))
    doLast {
        def outputDir = layout.buildDirectory.dir('named-runtime-api/v2').get().asFile
        outputDir.mkdirs()
        namedRuntimeSources.each { jarFile ->
            def zip = new java.util.zip.ZipFile(jarFile)
            try {
                def changes = [:]
                zip.entries().each { entry ->
                    if (!entry.directory && (entry.name.endsWith('.classtweaker') || entry.name.endsWith('.accesswidener'))) {
                        def original = zip.getInputStream(entry).getText('UTF-8')
                        def normalized = original.replaceFirst(/(?m)^((?:classTweaker|accessWidener)\s+v\d+\s+)official(\s*)$/, '$1named$2')
                        if (normalized != original) changes[entry.name] = normalized.getBytes('UTF-8')
                    }
                }
                def copy = namedRuntimeCopyFor(jarFile)
                if (!copy.isFile()) {
                    def temporary = new File(copy.parentFile, copy.name + ".tmp")
                    def out = new java.util.zip.ZipOutputStream(new FileOutputStream(temporary))
                    try {
                        zip.entries().each { entry ->
                            out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                            if (!entry.directory) out.write(changes[entry.name] ?: zip.getInputStream(entry).bytes)
                            out.closeEntry()
                        }
                    } finally { out.close() }
                    java.nio.file.Files.move(temporary.toPath(), copy.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.ATOMIC_MOVE)
                }
            } finally { zip.close() }
        }
        logger.lifecycle("Prepared ${namedRuntimeCopies.size()} isolated named-runtime API copies.")
    }
}

afterEvaluate {
    tasks.withType(net.fabricmc.loom.task.RunGameTask).all { runTask ->
        dependsOn('normalizeFabricApiTweakersForNamedDevRuntime')
        def classpathProducers = classpath.buildDependencies.getDependencies(runTask).toList()
        dependsOn(classpathProducers)
        def originals = classpath.files.toList()
        def copies = originals.collect { file ->
            if (file.absolutePath.contains('/net.fabricmc.fabric-api/') && file.name.endsWith('.jar')) {
                namedRuntimeSources.add(file)
                return namedRuntimeCopyFor(file)
            }
            return file
        }
        setClasspath(files(copies))
    }
}

tasks.matching { task -> task.name == "runClientGameTest" }.configureEach {
    doLast {
        copy {
            from(file("${buildDir}/run/clientGameTest/screenshots"))
            include("*_totem-alchemy-creative-showcase.png")
            rename { name -> name.replaceFirst(/^\d+_/, "") }
            into(file("test-artifacts/screenshots/modrinth-gallery"))
        }
        copy {
            from(file("${buildDir}/run/clientGameTest/screenshots"))
            include("*_alchemy-manual-spread-*.png")
            rename { name -> name.replaceFirst(/^\d+_/, "") }
            into(file("test-artifacts/screenshots/alchemy-manual-zh_tw"))
        }
        copy {
            from(file("${buildDir}/run/clientGameTest/screenshots"))
            include("*_alchemy-cauldron-hud-*.png")
            rename { name -> name.replaceFirst(/^\d+_/, "") }
            into(file("test-artifacts/screenshots/alchemy-cauldron-hud"))
        }
        copy {
            from(file("${buildDir}/run/clientGameTest/screenshots"))
            include("*_alchemy-large-flask-tooltip-*.png")
            rename { name -> name.replaceFirst(/^\d+_/, "") }
            into(file("test-artifacts/screenshots/alchemy-large-flask"))
        }
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
    // zh_cn intentionally reuses zh_tw; maintain only the Traditional Chinese source.
    doLast {
        copy {
            from(file('src/main/resources/assets/totem/lang/zh_tw.json'))
            into(file("${destinationDir}/assets/totem/lang"))
            rename { 'zh_cn.json' }
        }
    }
}
tasks.named('jar', Jar) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
